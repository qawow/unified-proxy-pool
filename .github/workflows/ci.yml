name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GOPROXY: https://proxy.golang.org,direct
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Dockerfile nounset guard
        run: bash scripts/check-dockerfile.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Go test (race)
        run: go test -race -count=1 ./...
      - name: govulncheck
        # setup-go pins GOTOOLCHAIN=local, but govulncheck@latest can require a
        # newer Go than go.mod's — let this one step fetch the toolchain it needs.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Go binary
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X unified-proxy-pool/internal/version.Commit=${GITHUB_SHA} -X unified-proxy-pool/internal/version.Time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o unified-proxy-pool ./cmd/app
          printf '%s\n' "${GITHUB_SHA}" > version.txt
          # The hot updater refuses to install a binary it cannot check against
          # this file, so it must ship with every release asset.
          sha256sum unified-proxy-pool > unified-proxy-pool.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: unified-proxy-pool-linux-amd64
          path: unified-proxy-pool
      - name: Nightly binary (hot update)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "nightly" --notes "linux/amd64 hot-update channel"
          gh release upload nightly unified-proxy-pool version.txt unified-proxy-pool.sha256 --clobber
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" unified-proxy-pool unified-proxy-pool.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag || gh release upload "${GITHUB_REF_NAME}" unified-proxy-pool unified-proxy-pool.sha256 --clobber

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
            MIHOMO_ASSET=
            GIT_SHA=${{ github.sha }}
            GIT_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
